spring:
  main:
    web-application-type: none
  application:
    name: indexation-sujet-batch

  datasource:
    h2:
      jdbc-url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      initialization-mode: always

  batch:
    jdbc:
      initialize-schema: never

app:
  batch:
    enabled: true
    action: update
    output-directory: ${INDEXATION_SUJET_BATCH_OUTPUT_DIR}
    output-filename: ${INDEXATION_SUJET_BATCH_CSV_OUTPUT_FILENAME:export_rameau.csv}
    vectorization-url: ${INDEXATION_SUJET_BATCH_VECTORIZATION_URL}
    partition:
      chunk-size: ${INDEXATION_SUJET_BATCH_CHUNK_SIZE}
      source-table: ${INDEXATION_SUJET_BATCH_SOURCE_TABLE}

  datasource:
    oracle:
      driver-class-name: oracle.jdbc.OracleDriver
      jdbc-url: jdbc:oracle:thin:@//${INDEXATION_SUJET_ORACLE_HOST}:${INDEXATION_SUJET_ORACLE_PORT}/${INDEXATION_SUJET_ORACLE_SERVICE}
      username: ${INDEXATION_SUJET_ORACLE_USER}
      password: ${INDEXATION_SUJET_ORACLE_PASSWORD}

logging:
  level:
    fr.abes.indexation-sujetbatchdump: DEBUG
    org.springframework.batch: INFO
